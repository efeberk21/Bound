<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" fill="none" role="img" aria-labelledby="title description">
  <title id="title">BOUND — Revoke the task. Keep the agent working.</title>
  <desc id="description">One agent connects to two projects. Atlas is revoked; Boreal remains authorized. Task-scoped authority on Arkiv.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#191C18"/><stop offset="1" stop-color="#0D100E"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(1295 414) rotate(90) scale(330 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9F46B" stop-opacity=".085"/><stop offset="1" stop-color="#C9F46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="surface" x1="1110" y1="340" x2="1450" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C3425"/><stop offset="1" stop-color="#1B2118"/>
    </linearGradient>
    <linearGradient id="agent" x1="907" y1="250" x2="1025" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#353A31"/><stop offset="1" stop-color="#20251F"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="620" rx="28" fill="url(#background)"/>
  <rect width="1600" height="620" rx="28" fill="url(#light)"/>
  <rect x=".5" y=".5" width="1599" height="619" rx="27.5" stroke="#FFFFFF" stroke-opacity=".10"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <g transform="translate(87 83) scale(1.5)" stroke="#C9F46B" stroke-width="3.5">
      <path d="M6 8h10a8 8 0 0 1 0 16H6V8Z"/><path d="M15 8h11v16H15"/>
    </g>
    <text x="151" y="119" fill="#C0C7B9" font-size="20" font-weight="500" letter-spacing="3">TASK-SCOPED AUTHORITY</text>
    <text x="88" y="266" fill="#F6F7F1" font-size="136" font-weight="650" letter-spacing="-8">bound<tspan fill="#C9F46B">.</tspan></text>
    <text x="94" y="352" fill="#F6F7F1" font-size="47" font-weight="600" letter-spacing="-1.8">Revoke the task.</text>
    <text x="94" y="410" fill="#AEB7A7" font-size="43" font-weight="400" letter-spacing="-1.6">Keep the agent working.</text>
    <path d="M94 480H710" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="94" y="530" fill="#C9F46B" font-size="22" font-weight="500">Built on Arkiv</text>
    <circle cx="257" cy="523" r="2.5" fill="#65715D"/>
    <text x="278" y="530" fill="#98A28F" font-size="21">Open source</text>
    <circle cx="420" cy="523" r="2.5" fill="#65715D"/>
    <text x="441" y="530" fill="#98A28F" font-size="21">MIT licensed</text>

    <path d="M1024 310H1067V220H1110" stroke="#65705E" stroke-width="2" stroke-dasharray="6 8"/>
    <path d="M1024 310H1067V418H1110" stroke="#C9F46B" stroke-width="2.5"/>
    <circle cx="1067" cy="310" r="5" fill="#C9F46B"/>
    <circle cx="966" cy="310" r="60" fill="#000" fill-opacity=".15" transform="translate(0 9)"/>
    <circle cx="966" cy="310" r="59.5" fill="url(#agent)" stroke="#64705A"/>
    <g stroke="#E5EBDC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="941" y="290" width="50" height="40" rx="12"/>
      <path d="M966 280V290M930 305V315M1002 305V315M953 340H979"/>
    </g>
    <circle cx="957" cy="309" r="3" fill="#C9F46B"/><circle cx="975" cy="309" r="3" fill="#C9F46B"/>
    <text x="966" y="405" text-anchor="middle" fill="#C4CDBB" font-size="23" font-weight="500">One agent</text>

    <rect x="1110" y="146" width="340" height="148" rx="24" fill="#1B201B" stroke="#FFFFFF" stroke-opacity=".10"/>
    <text x="1141" y="194" fill="#CDD2C8" font-size="28" font-weight="600" letter-spacing="-.6">Atlas</text>
    <circle cx="1403" cy="184" r="14" stroke="#7D8973" stroke-width="1.5"/>
    <path d="M1397 184H1409" stroke="#A0AA97" stroke-width="2" stroke-linecap="round"/>
    <text x="1141" y="231" fill="#A7B09F" font-size="18" font-weight="500" letter-spacing="1.8">REVOKED</text>
    <text x="1141" y="265" fill="#7F8A77" font-size="20">Content + Preview deny</text>

    <rect x="1110" y="344" width="340" height="148" rx="24" fill="#000" fill-opacity=".16" transform="translate(0 10)"/>
    <rect x="1110" y="344" width="340" height="148" rx="24" fill="url(#surface)" stroke="#C9F46B" stroke-opacity=".38"/>
    <path d="M1134 344.5H1426" stroke="#E5FFC0" stroke-opacity=".15"/>
    <text x="1141" y="392" fill="#F1F5E9" font-size="28" font-weight="600" letter-spacing="-.6">Boreal</text>
    <circle cx="1403" cy="382" r="14" fill="#C9F46B"/>
    <path d="m1397 382 4 4 8-9" stroke="#26311A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1141" y="429" fill="#C9F46B" font-size="18" font-weight="600" letter-spacing="1.4">STILL AUTHORIZED</text>
    <text x="1141" y="463" fill="#A6B298" font-size="20">Content + Preview allow</text>
